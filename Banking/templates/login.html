{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:60vh">
  <div class="col-lg-5 col-md-7">
    <div class="card glass">
      <div class="card-body p-4">
        <div class="text-center mb-3">
          <div class="display-6"><i class="bi bi-bank2 text-primary"></i></div>
          <h3 class="mb-1">Welcome to BankPro</h3>
          <div class="text-muted">Securely access your accounts</div>
        </div>
        <form method="post" class="mt-3">
          <div class="mb-3">
            <label class="form-label">User ID</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input class="form-control" name="uid" placeholder="Enter your numeric User ID" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">PIN</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
              <input type="password" class="form-control" name="pin" minlength="4" maxlength="4" pattern="[0-9]{4}" placeholder="4-digit PIN" required>
            </div>
          </div>
          <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Login</button>
        </form>
        <div class="text-center mt-3">
          <a href="{{ url_for('register') }}">New here? Create an account</a>
        </div>
      </div>
    </div>
  </div>
  </div>
{% endblock %}
