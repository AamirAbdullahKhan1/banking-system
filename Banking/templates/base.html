<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banking System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.0/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { 
      min-height: 100vh; 
      background: radial-gradient(1200px 600px at 10% -10%, #cfe2ff 0%, rgba(207,226,255,0) 55%),
                  radial-gradient(900px 500px at 110% 10%, #e2f0d9 0%, rgba(226,240,217,0) 50%),
                  #f7f9fc;
    }
    .navbar-brand { font-weight: 800; letter-spacing: .5px; }
    .card { border: 0; border-radius: 1rem; box-shadow: 0 1rem 2rem rgba(16,24,40,.06); }
    .glass { backdrop-filter: blur(8px); background: rgba(255,255,255,.75); }
    .chip { display:inline-flex; align-items:center; gap:.4rem; border-radius: 999px; padding:.25rem .6rem; font-size:.85rem; }
    .chip-danger { background:#ffe3e3; color:#b4231a; }
    .chip-warning { background:#fff3cd; color:#8a6d3b; }
    .chip-success { background:#d1e7dd; color:#0f5132; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}">BankPro</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        {% if session.get('uid') %}
        <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></li>
        {% else %}
        <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Login</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('register') }}">Register</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
  {% with messages = get_flashed_messages() %}
  {% if messages %}
  <div class="alert alert-info">{{ messages[0] }}</div>
  {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
